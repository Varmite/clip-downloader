<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Clip Downloader</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--accent)"/>
          <path d="M16 7v12m-5.5-5.5L16 19l5.5-5.5M9.5 24h13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Clip Downloader</span>
      </div>
      <div class="sites" id="sites" aria-label="Supported sites">
        <span class="site" data-site="YouTube">YouTube</span>
        <span class="site" data-site="TikTok">TikTok</span>
        <span class="site" data-site="Instagram">Instagram</span>
      </div>
    </header>

    <div class="link-box" id="linkBox">
      <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Video link"
             placeholder="Paste a YouTube, TikTok or Instagram link">
      <span class="badge" id="siteBadge" hidden></span>
      <button class="btn subtle" id="paste" type="button">Paste</button>
    </div>

    <section class="card preview" id="preview">
      <div class="thumb" id="thumbBox">
        <img id="thumb" alt="" referrerpolicy="no-referrer" hidden>
        <svg class="thumb-empty" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/>
        </svg>
        <span class="chip-time" id="duration" hidden></span>
      </div>
      <div class="details">
        <div class="title" id="title">Paste a link to get started</div>
        <div class="meta" id="meta">Video details show up here automatically.</div>
      </div>
    </section>

    <section class="card options">
      <div class="row">
        <span class="label">Format</span>
        <div class="segmented" id="format" role="radiogroup" aria-label="Format">
          <button type="button" role="radio" data-v="0">MP4</button>
          <button type="button" role="radio" data-v="1">MKV</button>
          <button type="button" role="radio" data-v="2">MP3</button>
          <button type="button" role="radio" data-v="3">M4A</button>
        </div>
      </div>
      <p class="hint" id="formatHint"></p>
      <div class="row">
        <label class="label" for="quality">Quality</label>
        <div class="select-wrap">
          <select id="quality">
            <option value="0">Best H.264 (up to 1080p)</option>
            <option value="1">Max – up to 4K (slower)</option>
            <option value="2">720p</option>
            <option value="3">480p</option>
            <option value="4">360p</option>
          </select>
        </div>
      </div>
      <div class="row">
        <span class="label">Save to</span>
        <div class="folder">
          <span class="folder-path" id="folder"></span>
          <button class="btn subtle" id="browse" type="button">Change…</button>
        </div>
      </div>
    </section>

    <section class="progress" id="progress">
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="status-row">
        <span class="status" id="status" role="status" aria-live="polite">Ready</span>
        <button class="link" id="logLink" type="button" hidden>Show log</button>
      </div>
    </section>

    <footer class="actions">
      <span class="engine" id="engine"></span>
      <button class="btn secondary" id="open" type="button">Open folder</button>
      <button class="btn primary" id="download" type="button">Download</button>
    </footer>
  </main>
</body>
</html>
